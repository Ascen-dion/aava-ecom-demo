# Server Configuration
server.port=8080

# ----------------------------
# PostgreSQL Database Configuration
# ----------------------------
# TODO change URL from LOCALHOST to Postgre URL and PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=postgres
spring.datasource.password=@dmin12345
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Enable SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# ----------------------------
# CORS Configuration (allows React to communicate with backend)
# ----------------------------
spring.web.cors.allowed-origins=https://ecomm-frontend-dvcdhygrandkdyhm.eastus-01.azurewebsites.net
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*